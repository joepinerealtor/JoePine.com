<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KW Leading Edge Portal Has Moved</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta http-equiv="refresh" content="5; url=https://portal.kwleadingedge.com/">
  <link rel="canonical" href="https://portal.kwleadingedge.com/">
  <style>
    :root {
      --page-bg: #f4ede5;
      --card-bg: rgba(255, 255, 255, 0.92);
      --card-border: rgba(120, 97, 74, 0.16);
      --text-main: #2d2a27;
      --text-muted: #6d645b;
      --accent: #c8102e;
      --accent-dark: #8f0e23;
      --shadow: 0 24px 60px rgba(53, 41, 31, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at top left, rgba(200, 16, 46, 0.14), transparent 34%),
        radial-gradient(circle at bottom right, rgba(120, 97, 74, 0.16), transparent 32%),
        var(--page-bg);
    }

    .notice-card {
      width: min(100%, 760px);
      padding: 40px 40px 34px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .logo {
      display: inline-block;
      max-width: 100%;
      margin-bottom: 24px;
    }

    .logo img {
      width: min(100%, 320px);
      height: auto;
      display: block;
    }

    .eyebrow {
      margin: 0 0 10px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(2rem, 4vw, 3.2rem);
      line-height: 0.96;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    p {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--text-muted);
    }

    .link-line {
      margin-top: 10px;
      font-size: 1rem;
    }

    a {
      color: var(--accent-dark);
      text-decoration-thickness: 0.08em;
      text-underline-offset: 0.16em;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 28px;
      padding: 14px 24px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .button:hover,
    .button:focus-visible {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
      transform: translateY(-1px);
    }

    .countdown {
      margin-top: 18px;
      font-size: 0.96rem;
      color: var(--text-muted);
    }

    .countdown strong {
      color: var(--text-main);
    }

    @media (max-width: 640px) {
      body {
        padding: 20px 14px;
      }

      .notice-card {
        padding: 28px 22px 24px;
      }

      p {
        font-size: 0.98rem;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="notice-card">
    <a class="logo" href="https://portal.kwleadingedge.com/" aria-label="Go to the new KW Leading Edge portal">
      <img src="brand/kw-leading-edge-logo.png" alt="Keller Williams Leading Edge">
    </a>
    <p class="eyebrow">KW Portal Update</p>
    <h1>This site has moved.</h1>
    <p>The Keller Williams Leading Edge portal is now hosted at the new address below.</p>
    <p class="link-line"><a href="https://portal.kwleadingedge.com/">portal.kwleadingedge.com</a></p>
    <a class="button" href="https://portal.kwleadingedge.com/">Go to the new portal</a>
    <p class="countdown">Automatic redirect in <strong data-countdown>5</strong> seconds.</p>
  </main>
  <script>
    (function () {
      var targetUrl = "https://portal.kwleadingedge.com/";
      var countdown = 5;
      var countdownNode = document.querySelector("[data-countdown]");
      if (!countdownNode) {
        return;
      }

      var timer = window.setInterval(function () {
        countdown -= 1;
        if (countdown <= 0) {
          window.clearInterval(timer);
          window.location.replace(targetUrl);
          return;
        }
        countdownNode.textContent = String(countdown);
      }, 1000);
    }());
  </script>
</body>
</html>
